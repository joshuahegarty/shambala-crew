<style>
:root{--t4:#FF2D95;--t3:#FF7A00;--t2:#0FBF9F;--t1:#8E9BB0;--bg:#f6f5f8;--card:#fff;--ink:#181820;--mut:#6b6b78;--line:#ececf1;--pur:#8338EC;}
body.dark{--bg:#14141b;--card:#1f1f29;--ink:#f1f1f5;--mut:#9a9aa8;--line:#2c2c38;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px;}
header{background:linear-gradient(135deg,#1DB954,#00BBF9 35%,#8338EC 70%,#FF2D95);color:#fff;padding:16px 16px 14px;position:relative;}
header .ttl{font-size:12.5px;letter-spacing:4px;font-weight:800;opacity:.95;}
header .big{font-size:25px;font-weight:900;letter-spacing:-.5px;margin-top:2px;}
header .sub{font-size:12px;opacity:.95;margin-top:5px;line-height:1.4;}
header .count{display:inline-block;margin-top:9px;background:rgba(0,0,0,.22);border:1.5px solid rgba(255,255,255,.5);border-radius:30px;padding:5px 13px;font-size:12.5px;font-weight:700;}
.hbtns{position:absolute;top:14px;right:14px;display:flex;gap:8px;}
.hbtn{background:rgba(0,0,0,.2);border:1.5px solid rgba(255,255,255,.55);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0;}
.hbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);z-index:20;box-shadow:0 -3px 14px rgba(0,0,0,.06);}
.tabs::-webkit-scrollbar{display:none;}
.tabs button{flex:0 0 auto;min-width:57px;border:0;background:none;padding:8px 6px 7px;font-size:9.5px;font-weight:700;color:var(--mut);}
.tabs button .ic{display:block;width:21px;height:21px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tabs button.on{color:var(--pur);}
main{padding:14px 12px 8px;}
.controls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px;}
.controls input{flex:1 1 100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--card);color:var(--ink);}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:30px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap;}
.chip.on{color:#fff;border-color:transparent;}
.chip.t4.on{background:var(--t4);}.chip.t3.on{background:var(--t3);}.chip.t2.on{background:var(--t2);}.chip.t1.on{background:var(--t1);}
.chip.all.on{background:#181820;}.chip.go.on{background:#1DB954;}.chip.v.on{background:var(--pur);}
.chip.seen.on{background:#FFB300;color:#181820;}
.rate{display:flex;align-items:center;gap:1px;margin-top:9px;}
.star{background:none;border:0;font-size:18px;line-height:1;color:#d9d9e0;cursor:pointer;padding:0 1px;}
.star.on{color:#FFB300;}
.ratelbl{font-size:10.5px;color:var(--mut);font-weight:700;margin-left:8px;}
.vrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin:0 0 12px;-webkit-overflow-scrolling:touch;}
.vrow .chip{flex:0 0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:14px;padding:11px 12px;margin-bottom:10px;}
.card.t4{border-left-color:var(--t4);}.card.t3{border-left-color:var(--t3);}.card.t2{border-left-color:var(--t2);}.card.t1{border-left-color:var(--t1);}
.row{display:flex;gap:11px;}
.av{width:46px;height:46px;border-radius:50%;flex:0 0 46px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;background-size:cover;background-position:center;border:0;cursor:pointer;position:relative;}
.t4 .av{background-color:var(--t4);}.t3 .av{background-color:var(--t3);}.t2 .av{background-color:var(--t2);}.t1 .av{background-color:var(--t1);}
.av .cam{position:absolute;bottom:-2px;right:-2px;background:#181820;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card);}
.cc{flex:1;min-width:0;}
.cn{font-size:15px;font-weight:800;line-height:1.15;}
.badge{font-size:10px;font-weight:800;color:#fff;border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
.t4 .badge{background:var(--t4);}.t3 .badge{background:var(--t3);}.t2 .badge{background:var(--t2);}.t1 .badge{background:var(--t1);}
.cm{font-size:11.5px;color:var(--mut);margin:3px 0 5px;font-weight:600;}
.cm .v{color:var(--pur);font-weight:800;}
.cd{font-size:12px;color:var(--ink);opacity:.82;line-height:1.4;}
.cb{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center;}
.btn{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:5px 11px;font-size:11.5px;font-weight:800;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;cursor:pointer;}
.btn.sp{background:#1DB954;color:#fff;border-color:transparent;}
.btn.yt{background:#181820;color:#fff;border-color:transparent;}
.btn.go{margin-left:auto;}.btn.go.on{background:#1DB954;color:#fff;border-color:transparent;}
.expand{margin-top:11px;border-top:1px solid var(--line);padding-top:11px;}
.expand iframe{width:100%;height:152px;border:0;border-radius:12px;}
.photoctl{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center;}
.nospot{font-size:11.5px;color:var(--mut);}
.days{display:flex;gap:5px;}
.dbtn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--mut);}
.dbtn.on{background:var(--pur);color:#fff;border-color:transparent;}
.tchip{display:inline-block;background:var(--pur);color:#fff;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800;margin-right:5px;}
.tinput{border:1px solid var(--line);border-radius:9px;padding:4px 7px;background:var(--bg);color:var(--ink);font-size:12px;}
.clash{display:inline-block;background:#E53935;color:#fff;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:800;margin-right:5px;}
.clashnote{background:#FDECEA;color:#B71C1C;border:1px solid #F5C6C0;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;margin-bottom:9px;}
.mealsline{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:9px;}
.mealsline b{color:var(--pur);}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:13px 14px;font-size:12.5px;color:var(--mut);line-height:1.5;margin-bottom:12px;}
.note b{color:var(--ink);}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;}
.bar .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;margin-bottom:7px;}
.bar .top small{color:var(--mut);font-weight:700;}
.track{height:11px;background:var(--line);border-radius:8px;overflow:hidden;}
.fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#8338EC,#FF2D95);}
.seg{font-size:11px;color:var(--mut);margin-top:6px;}
.modebar{display:flex;gap:7px;margin-bottom:12px;}
.dayhead{font-weight:900;font-size:16px;margin:18px 2px 2px;}
.daytheme{font-size:11.5px;color:var(--mut);margin:0 2px 9px;font-weight:700;}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:18px 10px;}
.maptxt{font-size:11px;font-weight:800;fill:#fff;}.maptxt.dk{fill:#23231f;}
.maphint{font-size:9.5px;fill:#7a8a6a;font-weight:700;}
h3.sec{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:18px 2px 9px;font-weight:800;}
textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;background:var(--bg);color:var(--ink);font-family:monospace;resize:vertical;}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:var(--card);color:var(--ink);margin-bottom:8px;}
.big-btn{display:block;width:100%;background:var(--pur);color:#fff;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:800;margin:6px 0 14px;}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding:18px 16px 40px;}
.overlay h2{font-size:20px;font-weight:900;margin:0 0 4px;}
.ck{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:13px;font-weight:600;}
.ck input{width:20px;height:20px;}
.ck.done{opacity:.55;text-decoration:line-through;}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;font-weight:800;}
.sw{width:50px;height:28px;border-radius:30px;background:var(--line);position:relative;border:0;}
.sw.on{background:#1DB954;}
.sw b{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;}
.sw.on b{left:25px;}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;font-size:12.5px;line-height:1.5;color:var(--ink);}

.crewtag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;margin:2px 4px 2px 0;}
.x{background:none;border:0;color:var(--mut);font-size:18px;font-weight:800;}
.fab{position:fixed;right:16px;bottom:92px;width:60px;height:60px;border-radius:50%;border:0;z-index:25;background:linear-gradient(135deg,#FF7A00,#FF2D95);color:#fff;font-size:27px;box-shadow:0 6px 18px rgba(0,0,0,.28);}
#droppreview img{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-bottom:8px;}
select.field{appearance:none;-webkit-appearance:none;}
.drop-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;}
.drop-item img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:0 0 52px;}
.drop-item .noimg{width:52px;height:52px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 52px;}
.drop-item .di{flex:1;min-width:0;font-size:12.5px;}
.drop-item .di small{color:var(--mut);display:block;margin-top:2px;}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;display:flex;gap:11px;}
.tcell{flex:0 0 56px;font-weight:800;font-size:12px;color:var(--pur);padding-top:2px;line-height:1.3;}
.fav{background:none;border:0;font-size:19px;cursor:pointer;color:#cfcfd6;padding:0;line-height:1;margin-left:auto;}
.fav.on{color:#FFB300;}
.meal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;}
.meal label{font-size:11px;font-weight:800;color:var(--mut);display:block;margin-bottom:4px;}
.meal select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:13px;}

    const me={g:[...going].map(n=>IDX[n]).filter(i=>i!=null),s:{}};Object.keys(seen).forEach(n=>{if(IDX[n]!=null)me.s[IDX[n]]=seen[n];});
    const people=[me,...names.map(n=>crew[n])];
    const cnt={};people.forEach(p=>(p.g||[]).forEach(i=>{cnt[i]=(cnt[i]||0)+1;}));
    const wanted=Object.keys(cnt).map(i=>({a:ACTS[i],n:cnt[i]})).filter(o=>o.a&&o.n>=2).sort((x,y)=>y.n-x.n||y.a.tier-x.a.tier).slice(0,12);

    const acc={};people.forEach(p=>{const sm=p.s||{};Object.keys(sm).forEach(i=>{(acc[i]=acc[i]||[]).push(sm[i]);});});
    const rated=Object.keys(acc).map(i=>{const ar=acc[i];return{a:ACTS[i],avg:ar.reduce((s,v)=>s+v,0)/ar.length,n:ar.length};}).filter(o=>o.a).sort((x,y)=>y.avg-x.avg||y.n-x.n).slice(0,12);
    if(rated.length){h+=`<h3 class="sec">Crew's top-rated sets</h3>`+rated.map(o=>`<div class="bar"><div class="top"><span>${esc(o.a.name)}</span><small>${o.avg.toFixed(1)}/5 &middot; ${o.n} rated</small></div></div>`).join("");}}
  c.innerHTML=h;}

let _db,MEM=[],useMem=false,dropPhoto=null,dropGeo=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open("shmb_moments",1);
 r.onupgradeneeded=e=>e.target.result.createObjectStore("drops",{keyPath:"id"});
 r.onsuccess=e=>{_db=e.target.result;res();};r.onerror=rej;});}
async function ensureDB(){if(useMem||_db)return;try{await openDB();}catch(e){useMem=true;}}
function _store(m){return _db.transaction("drops",m).objectStore("drops");}
async function dbAdd(o){await ensureDB();if(useMem){MEM.push(o);return;}return new Promise((res,rej)=>{const r=_store("readwrite").add(o);r.onsuccess=()=>res();r.onerror=rej;});}
async function dbAll(){await ensureDB();if(useMem)return MEM.slice();return new Promise((res,rej)=>{const r=_store("readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=rej;});}
async function dbDel(id){await ensureDB();if(useMem){MEM=MEM.filter(x=>x.id!==id);return;}return new Promise((res,rej)=>{const r=_store("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=rej;});}
function dropPhotoFile(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");
  const W=220,sc=Math.min(1,W/Math.max(img.width,img.height));c.width=img.width*sc;c.height=img.height*sc;
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);dropPhoto=c.toDataURL("image/jpeg",0.8);
  const pv=document.getElementById("droppreview");if(pv)pv.innerHTML='<img src="'+dropPhoto+'">';};img.src=e.target.result;};
 rd.readAsDataURL(f);}
function dropGPS(){if(!navigator.geolocation){alert("No GPS on this device/browser.");return;}
 navigator.geolocation.getCurrentPosition(p=>{dropGeo={lat:p.coords.latitude,lng:p.coords.longitude};
  const b=document.getElementById("gpsbtn");if(b)b.textContent="\uD83D\uDCCD "+dropGeo.lat.toFixed(4)+", "+dropGeo.lng.toFixed(4);},
  ()=>alert("Couldn't get GPS - it's often blocked when opening a file directly. The stage/area tag still works."));}
async function saveDrop(){const st=document.getElementById("dstage").value;const note=document.getElementById("dnote").value.trim();

 try{await dbAdd(e);}catch(err){alert("Couldn't save that one - storage may be full.");return;}
 dropPhoto=null;dropGeo=null;openDrops();}
async function delDrop(id){await dbDel(id);openDrops();}
function dl(name,type,data){const b=new Blob([data],{type:type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);}

function addActivity(){const n=document.getElementById("aname").value.trim();if(!n)return;const cat=document.getElementById("acat").value;const k=document.getElementById("akids").checked;
 userActs.push({name:n,cat:cat,kids:k,desc:"Added by you"});S("shmb_useracts",userActs);renderExplore();}
function delActivity(n){userActs=userActs.filter(a=>a.name!==n);S("shmb_useracts",userActs);renderExplore();}
function ecard(a){var fav=exploreFav.has(a.name),go=attend.has(a.name),ex=exExpanded.has(a.name),d=adays[a.name]||"";var nm=jsq(a.name);
 var db=DAYS.map(function(x){return `<button class="dbtn ${d===x[0]?'on':''}" onclick="setADay('${nm}','${x[0]}')">${x[0]}</button>`;}).join("");
 return `<div class="fcard"><div class="av" style="background-color:#8338EC" onclick="exExpand('${nm}')">${esc(initials(a.name))}</div><div class="cc">`
  +`<div class="cn" style="display:flex;align-items:center;gap:6px"><span onclick="exExpand('${nm}')" style="cursor:pointer">${esc(a.name)}</span><button class="fav ${fav?'on':''}" onclick="toggleExFav('${nm}')">${fav?'&#9733;':'&#9734;'}</button></div>`
  +`<div class="cm"><span class="gpill">${esc(a.cat)}</span>${a.kids?' <span class="gpill" style="background:#0FBF9F;color:#fff">&#128118; kids OK</span>':''}</div>`
  +(a.desc?`<div class="cd">${esc(a.desc)}</div>`:'')
  +`<div class="cb"><button class="btn go ${go?'on':''}" onclick="attendToggle('${nm}')">${go?'&#10003; Going':'&#43; Going'}</button><button class="btn" onclick="exExpand('${nm}')">${ex?'Less':'More'}</button>${a.user?`<button class="btn" onclick="delActivity('${nm}')">Remove</button>`:''}</div>`
  +(ex?`<div class="expand"><div class="cd">${esc(a.desc||'')}</div><div class="nospot" style="margin-top:6px">Full workshop &amp; activity programme (with times &amp; exact spots) is in the official Shambala app.</div>${go?`<div class="cm" style="margin-top:8px">Add to a day (shows on By Day):</div><div class="days" style="margin-top:4px">${db}</div>`:''}</div>`:'')
  +`</div></div>`;}

function renderExplore(){const c=document.getElementById("explore");
 let h='<div class="vrow">'+ECATS.map(ct=>'<button class="chip v '+(exploreCat===ct?'on':'')+'" onclick="exploreCat=\''+jsq(ct)+'\';renderExplore()">'+esc(ct)+'</button>').join("")+'<button class="chip go '+(exploreKids?'on':'')+'" onclick="exploreKids=!exploreKids;renderExplore()">&#128118; Kids-friendly</button></div>';
 h+='<div class="note">Beyond the bands: family stuff, wellness, and Shambala\'s gloriously weird side. The full programme firms up on site - <b>spot a roaming oddity (last year\'s musical bee!)? Add it below.</b></div>';
 h+='<button class="big-btn" style="background:#FF7A00" onclick="surprise()">&#127922; Surprise me</button>';
 if(surprisePick)h+='<div class="note" style="border-color:#FF7A00;border-style:solid"><b>Try this:</b> '+esc(surprisePick.name)+' &middot; '+esc(surprisePick.cat)+(surprisePick.desc?'<br>'+esc(surprisePick.desc):'')+'</div>';
 h+='<h3 class="sec">Add something you found</h3><input id="aname" class="field" placeholder="Name (e.g. Giant Musical Bee)"><select id="acat" class="field">'+ECATS.slice(1).map(ct=>'<option>'+esc(ct)+'</option>').join("")+'</select><label class="ck" style="margin-bottom:8px"><input type="checkbox" id="akids"> Suitable for kids</label><button class="big-btn" onclick="addActivity()">Add</button>';
 h+='<h3 class="sec">What\'s on</h3>';
 let list=allActs().filter(a=>(exploreCat==="All"||a.cat===exploreCat)&&(!exploreKids||a.kids));
 list.sort((x,y)=>(exploreFav.has(y.name)-exploreFav.has(x.name))||x.name.localeCompare(y.name));
 h+= list.length?list.map(ecard).join(""):'<div class="empty">Nothing matches this filter.</div>';
 c.innerHTML=h;}
function surprise(){const pool=allActs();surprisePick=pool[Math.floor(Math.random()*pool.length)];renderExplore();}
function loadWeather(){const el=document.getElementById("wx");if(!el)return;
 fetch("https://api.open-meteo.com/v1/forecast?latitude=52.41&longitude=-0.95&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FLondon&start_date=2026-08-27&end_date=2026-08-30")
  .then(r=>r.json()).then(d=>{if(!d||!d.daily||!d.daily.time||!d.daily.time.length){el.innerHTML='<div class="info">Forecast appears about two weeks before the festival - check back in mid-August.</div>';return;}
   const wc={0:"Clear",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Snow",73:"Snow",75:"Snow",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"};
   const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];let s="";
   for(let i=0;i<d.daily.time.length;i++){const dt=new Date(d.daily.time[i]);
     s+='<div class="info" style="display:flex;justify-content:space-between;gap:8px"><span><b>'+dn[dt.getDay()]+'</b> '+(wc[d.daily.weathercode[i]]||"")+'</span><span>'+Math.round(d.daily.temperature_2m_max[i])+'&deg;/'+Math.round(d.daily.temperature_2m_min[i])+'&deg; &middot; '+(d.daily.precipitation_probability_max[i]==null?0:d.daily.precipitation_probability_max[i])+'% rain</span></div>';}
   el.innerHTML=s;}).catch(e=>{el.innerHTML='<div class="info">Forecast unavailable - you may be offline. It loads when online, from about two weeks before the festival.</div>';});}
function showIntro(){const o=document.getElementById("intro");
 o.innerHTML='<h2 style="margin-bottom:10px">Welcome to the Crew Companion</h2>'
  +'<div class="info">Your shared guide to Shambala 2026. A quick tour:</div>'
  +'<div class="info"><b>Lineup</b> &mdash; acts colour-coded by our ratings. Tap a face to play or add a photo, hit <b>&#43; Going</b>, and star-score sets you catch (<b>Seen</b>).</div>'
  +'<div class="info"><b>By Day</b> &mdash; your calendar. Give picks a day and time; it flags clashes and shows your meals.</div>'
  +'<div class="info"><b>Food</b> and <b>Explore</b> &mdash; veg/vegan stalls plus the weird and family stuff. Favourite them or add your own finds.</div>'
  +'<div class="info"><b>Crew</b> &mdash; swap codes to see what the group wants. The <b>camera</b> (top-right) logs moments; the <b>gear</b> holds notes, weather and festival info.</div>'
  +'<button class="big-btn" onclick="closeIntro()">Got it</button>';
 o.style.display="";}
function closeIntro(){S("shmb_intro",true);document.getElementById("intro").style.display="none";}
try{
function tkey2(t){var p=t.split(":");var h=+p[0],m=+p[1];if(h<6)h+=24;return h*60+m;}
function fmt12(t){var p=t.split(":");var h=+p[0],m=p[1];var ap=h>=12?'pm':'am';var hh=h%12;if(hh===0)hh=12;return hh+':'+m+ap;}
function toggleSchedFav(id){schedFav.has(id)?schedFav.delete(id):schedFav.add(id);S("shmb_schedfav",[...schedFav]);renderTimes();}
function renderTimes(){var c=document.getElementById("times");
 var DX=[["Thu","Thu 27"],["Fri","Fri 28"],["Sat","Sat 29"],["Sun","Sun 30"]];
 var h='<div class="modebar">'+DX.map(function(d){return '<button class="chip '+(timesDay===d[0]?'all on':'')+'" onclick="timesDay=\''+d[0]+'\';timesStage=\'All\';renderTimes()">'+d[1]+'</button>';}).join('')+'</div>';
 var dayItems=SCHED.filter(function(e){return e[0]===timesDay;});
 if(!dayItems.length){c.innerHTML=h+'<div class="note"><b>'+timesDay+' isn\'t loaded yet.</b> Send the official Times list for this day (clear screenshots like the Thursday ones) and I\'ll add it.</div>';return;}
 var stages=['All'];dayItems.forEach(function(e){if(stages.indexOf(e[2])<0)stages.push(e[2]);});
 h+='<div class="vrow">'+stages.map(function(s){return '<button class="chip v '+(timesStage===s?'on':'')+'" onclick="timesStage=\''+jsq(s)+'\';renderTimes()">'+esc(s)+'</button>';}).join('')+'</div>';
 h+='<div class="controls"><input placeholder="Search act, stage or genre..." value="'+esc(timesQ)+'" oninput="timesQ=this.value;renderTimes();this.focus()"><button class="chip seen '+(timesFav?'on':'')+'" onclick="timesFav=!timesFav;renderTimes()">&#9733; Mine</button></div>';
 var q=timesQ.toLowerCase();
 var list=dayItems.filter(function(e){var id=e[0]+'|'+e[1]+'|'+e[3];return (timesStage==='All'||e[2]===timesStage)&&(!timesFav||schedFav.has(id))&&(!q||(e[3]+' '+e[4]+' '+e[2]).toLowerCase().indexOf(q)>=0);});
 list.sort(function(a,b){return tkey2(a[1])-tkey2(b[1])||a[2].localeCompare(b[2]);});
 h+='<div class="note" style="padding:8px 12px">'+list.length+' sets &middot; official times. Tap &#9733; to save yours (then filter with <b>&#9733; Mine</b>).</div>';
 h+=list.map(function(e){var id=e[0]+'|'+e[1]+'|'+e[3];var f=schedFav.has(id);
   return '<div class="fcard"><div class="tcell">'+fmt12(e[1])+'</div><div class="cc"><div class="cn" style="display:flex;align-items:center;gap:6px;font-size:14px"><span>'+esc(e[3])+'</span><button class="fav '+(f?'on':'')+'" onclick="toggleSchedFav(\''+jsq(id)+'\')">'+(f?'&#9733;':'&#9734;')+'</button></div><div class="cm"><span class="v">'+esc(e[2])+'</span></div>'+(e[4]?'<div class="cd" style="font-size:10.5px;color:var(--mut)">'+esc(e[4])+'</div>':'')+'</div></div>';
 }).join('');
 c.innerHTML=h;}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
refresh();
if(!L("shmb_intro",false))showIntro();
}catch(err){var mn=document.querySelector("main");if(mn)mn.innerHTML='<div class="note" style="margin:16px">Couldn\'t start the app: '+((err&&err.message)||err)+'. Pull to refresh; if it keeps happening, screenshot this.</div>';}
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./service-worker.js").catch(function(){});});}</script></body></html>
